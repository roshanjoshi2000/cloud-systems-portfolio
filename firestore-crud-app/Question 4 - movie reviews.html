<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <title>My Firebase app</title>
  </head>
  <body>
    <div class="container">
      <h1 id="mainTitle">My Movies</h1>
      <div class="d-flex mb-2">
        <input
          type="text"
          class="form-control"
          id="movieName"
          placeholder="Movie's name"
        />
        <select class="form-control mx-2 w-25" id="movieRating">
          <option value="1">1/5</option>
          <option value="2">2/5</option>
          <option value="3">3/5</option>
          <option value="4">4/5</option>
          <option value="5">5/5</option>
        </select>
        <input
          type="text"
          class="form-control"
          id="director"
          placeholder="Director's name"
        />
        <input type="date" class="form-control" id="releaseDate" />
        <button type="button" class="btn btn-primary" id="addButton">
          Add
        </button>
      </div>

      <div>
        <label for="sortColumn">Sort by:</label>
        <select id="sortColumn">
          <option value="movie_name">Movie Name</option>
          <option value="movie_rating">Rating</option>
          <option value="director">Director</option>
          <option value="release_date">Release Date</option>
        </select>

        <label for="sortOrder">Order:</label>
        <select id="sortOrder">
          <option value="asc">Ascending</option>
          <option value="desc">Descending</option>
        </select>

        <button id="sort" class="btn btn-primary">Apply Sort</button>
      </div>

      <table class="table table-striped">
        <tbody id="reviewList"></tbody>
      </table>
    </div>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.js"></script>

    <!-- Our Firebase code -->
    <!-- The Javascript code in myscripts.js was placed here to tackle the CoRs error which occurred due to the dependencies imported directly from the web. -->
    <script type="module">
      // Import the functions you need from the SDKs you need
      import { initializeApp } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-app.js";

      // Add SDKs for Firebase products that you want to use
      import {
        Firestore,
        getFirestore,
        onSnapshot,
        query,
        collection,
        orderBy,
        addDoc,
        doc,
        deleteDoc,
        setDoc,
      } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-firestore.js";

      // Your web app's Firebase configuration
      const firebaseConfig = {
        apiKey: "AIzaSyDvXhO54JFTJGaSw29dcPyQShtvbXfdxHs",
        authDomain: "movie-review-bc5d1.firebaseapp.com",
        projectId: "movie-review-bc5d1",
        storageBucket: "movie-review-bc5d1.firebasestorage.app",
        messagingSenderId: "297093131141",
        appId: "1:297093131141:web:646282f55cf75ed11972ec",
      };

      // Initialize Firebase
      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);

      let sortingColumn = "movie_name";
      let sortingOrder = "asc";

      // Get a live data snapshot (i.e. auto-refresh) of our Reviews collection
      const fetchReviews = () => {
        const q = query(
          collection(db, "Reviews"),
          orderBy(sortingColumn, sortingOrder)
        );
        const unsubscribe = onSnapshot(q, (snapshot) => {
          // Empty HTML table
          $("#reviewList").empty();

          // Loop through snapshot data and add to HTML table
          var tableRows = "";
          snapshot.forEach((doc) => {
            tableRows += "<tr data-doc-id=" + doc.id + ">";
            tableRows += "<td>" + doc.data().movie_name + "</td>";
            tableRows += "<td>" + doc.data().movie_rating + "/5</td>";
            tableRows += "<td>" + doc.data().director + "</td>";

            //Converting release_date to displayable formate
            const timestamp = doc.data().release_date.seconds;
            const date = new Date(timestamp * 1000);

            tableRows += "<td>" + date.toLocaleDateString("en-GB") + "</td>";

            tableRows +=
              "<td><button class='btn btn-primary' id='edit'>Edit</button>  <button class='btn btn-primary' id='delete'>Delete</button></td>";
            tableRows += "</tr>";
          });
          $("#reviewList").append(tableRows);

          // Display review count
          $("#mainTitle").html(snapshot.size + " movie reviews in the list");
        });
      };

      // Sort button pressed
      $("#sort").click(() => {
        sortingColumn = $("#sortColumn").val();
        sortingOrder = $("#sortOrder").val();
        console.log(sortingColumn, sortingOrder);

        fetchReviews(); // Refresh data with new sorting parameters
      });

      // Load default sorted data initially
      fetchReviews();

      // Add button pressed
      $("#addButton").click(function () {
        const release_date = new Date($("#releaseDate").val());

        // Add review to Firestore collection
        const docRef = addDoc(collection(db, "Reviews"), {
          movie_name: $("#movieName").val(),
          movie_rating: parseInt($("#movieRating").val()),
          director: $("#director").val(),
          release_date: release_date,
        });

        alert("New review successfully added");

        // Reset form
        $("#movieName").val("");
        $("#movieRating").val("1");
        $("#director").val("");
        $("#releaseDate").val(null);
      });

      // Delete button pressed
      $(document).on("click", "#delete", async function () {
        // Getting the closest row to the clicked button
        const row = $(this).closest("tr");
        // console.log("row:", row);

        // Retrieving the document ID stored in the rows data attribute
        const docId = row.data("doc-id");
        // console.log("docID:", docId);

        await deleteDoc(doc(db, "Reviews", docId))
          .then(() => {
            alert("Document successfully deleted!");
            row.remove();
          })
          .catch((error) => {
            alert("Error removing document: ", error);
          });
      });

      // Edit button pressed
      $(document).on("click", "#edit", async function () {
        const row = $(this).closest("tr");
        const docId = row.data("doc-id");

        // Extracting values of row
        const movieName = row.find("td:eq(0)").text();
        const movieRating = row.find("td:eq(1)").text().replace("/5", "");
        const director = row.find("td:eq(2)").text();
        var releaseDate = row.find("td:eq(3)").text();
        // console.log(movieName, movieRating, director, releaseDate);

        // Converting release date to a proper format
        const dateParts = releaseDate.split("/");
        releaseDate =
          "" + dateParts[2] + "-" + dateParts[1] + "-" + dateParts[0];

        // Create an editable form with current values
        var editForm = `
    <tr data-doc-id="${docId}">
      <td><input type="text" class="form-control" id="editMovieName" value="${movieName}"></td>
      <td><input type="number" class="form-control" id="editMovieRating" value="${movieRating}" min="1" max="5"></td>
      <td><input type="text" class="form-control" id="editDirector" value="${director}"></td>
      <td><input type="date" class="form-control" id="editReleaseDate" value="${releaseDate}"></td>
      <td>
        <button class='btn btn-primary' id='update'>Update</button>
      </td>
    </tr>
  `;

        // Replace row with the edit form
        row.replaceWith(editForm);
      });

      // Update button pressed
      $(document).on("click", "#update", async function () {
        const row = $(this).closest("tr");
        const docId = row.data("doc-id");

        const release_date = new Date($("#editReleaseDate").val());

        await setDoc(doc(db, "Reviews", docId), {
          movie_name: $("#editMovieName").val(),
          movie_rating: parseInt($("#editMovieRating").val()),
          director: $("#editDirector").val(),
          release_date: release_date,
        })
          .then(() => {
            alert("Document successfully updated!");
            row.remove();
          })
          .catch((error) => {
            alert("Error while updating document: ", error);
          });
      });
    </script>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
